name: Fetch expert ratings input
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/fetch_ea.py", ".github/workflows/ea.yml"]
  schedule:
    - cron: "41 12 * * 4"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_ea.py ea_ratings.json
      - name: Commit to main data folder
        run: |
          mkdir -p data && mv ea_ratings.json data/ea_ratings.json
          git config user.name "tff-data-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/ea_ratings.json
          git diff --cached --quiet && exit 0
          git commit -m "Update expert ratings input $(date -u +%F)"
          git pull --rebase -q origin main || true
          git push
