name: Refresh real NFL data
# Rebuilds data/league.json from nflverse twice a week during the season so
# "Start from real life" always uses the latest rosters, contracts, results and stats.
on:
  schedule:
    - cron: "17 13 * * 2"   # Tuesday after Monday Night Football
    - cron: "17 13 * * 5"   # Friday after Thursday Night Football
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow
      - run: python scripts/build_data.py .cache data/league.json && python scripts/stamp.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/league.json; then echo "No changes"; exit 0; fi
          git config user.name "tff-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/league.json version.json
          git commit -m "Refresh real NFL data $(date -u +%F)"
          git push
